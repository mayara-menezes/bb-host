{% with n=request.resolver_match.url_name %}
<nav class="flex flex-wrap gap-1.5" aria-label="Customer area">
  <a href="{% url 'customers:dashboard' %}" class="pill {% if n == 'dashboard' %}pill-active{% endif %}"><i class="fa fa-th-large"></i> Dashboard</a>
  <a href="{% url 'customers:services' %}" class="pill {% if n == 'services' %}pill-active{% endif %}"><i class="fa fa-server"></i> Services</a>
  <a href="{% url 'customers:invoices' %}" class="pill {% if n == 'invoices' or n == 'invoice' %}pill-active{% endif %}"><i class="fa fa-file-text-o"></i> Invoices</a>
  <a href="{% url 'customers:credit' %}" class="pill {% if n == 'credit' %}pill-active{% endif %}"><i class="fa fa-credit-card"></i> Credit</a>
  <a href="{% url 'customers:tickets' %}" class="pill {% if n == 'tickets' or n == 'ticket' or n == 'ticket_new' %}pill-active{% endif %}"><i class="fa fa-life-ring"></i> Support</a>
  <a href="{% url 'customers:profile' %}" class="pill {% if n == 'profile' or n == 'password' %}pill-active{% endif %}"><i class="fa fa-id-card-o"></i> Account</a>
  <form method="post" action="{% url 'customers:logout' %}">
    {% csrf_token %}
    <button type="submit" class="pill cursor-pointer"><i class="fa fa-sign-out"></i> Log out</button>
  </form>
</nav>
{% endwith %}
