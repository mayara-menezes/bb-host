{% extends 'base.html' %}

{% block title %}Change password | BB Host{% endblock %}

{% block content %}
  <section class="section-tight pb-16">
    <div class="container-site">
      {% include 'customers/_header.html' with title='Change password' icon='fa-lock' %}
      <form method="post" class="card max-w-md space-y-4" novalidate>
        {% csrf_token %}
        {% for field in form %}{% include 'partials/field.html' %}{% endfor %}
        <button type="submit" class="btn btn-primary">Save new password</button>
      </form>
    </div>
  </section>
{% endblock %}
